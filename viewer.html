<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --night: #0f1c2e;
  --ink: #f2f4f8;
  --ink-soft: #9aacc4;
  --gold: #e3a857;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: "Inter", Arial, sans-serif;
}
body { padding-bottom: 40px; }
.mark {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 24px;
  color: var(--ink-soft);
}
.mark svg { width: 18px; height: 18px; }
.mark span {
  font-family: "Fraunces", serif;
  font-size: 17px;
  font-weight: 500;
  color: var(--ink);
}
main { max-width: 1100px; margin: 0 auto; padding: 0 24px; text-align: center; }
#status { color: var(--ink-soft); font-size: 16px; }
video {
  width: 100%;
  margin-top: 20px;
  background: black;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
button {
  padding: 14px 28px;
  background: transparent;
  color: var(--ink-soft);
  border: 1px solid #2a3c56;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 24px;
}
button:hover { border-color: #e17b7b; color: #e17b7b; }
</style>
</head>
<body>
<div class="mark">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="12" cy="12" r="3" fill="currentColor"/>
    <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
  <span>Support</span>
</div>
<main>
  <p id="status">Connecting securely…</p>
  <video id="screen" autoplay playsinline muted controls></video>
  <p><button id="stopBtn">End session</button></p>
</main>

<script>
const statusEl = document.getElementById("status");
const video = document.getElementById("screen");
const stopBtn = document.getElementById("stopBtn");
const token = new URLSearchParams(location.search).get("token");

let socket = null;
let peer = null;
let finished = false;
let pendingCandidates = [];

function send(type, data) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type, data }));
  }
}

function finish(message) {
  if (finished) return;
  finished = true;
  if (peer) peer.close();
  if (socket) socket.close();
  video.srcObject = null;
  statusEl.textContent = message;
}

function createPeer(iceServers) {
  peer = new RTCPeerConnection({ iceServers: iceServers || [] });

  peer.ontrack = event => {
    video.srcObject = event.streams[0] || new MediaStream([event.track]);
    statusEl.textContent = "Grandpa's screen is connected ❤️";
    video.play().catch(() => {});
  };

  peer.onicecandidate = event => {
    if (event.candidate) send("candidate", event.candidate);
  };

  peer.onconnectionstatechange = () => {
    if (!peer || finished) return;
    if (peer.connectionState === "failed") {
      statusEl.textContent =
        "Connection failed. A TURN relay server is probably needed (see README).";
    }
    if (peer.connectionState === "disconnected") {
      statusEl.textContent = "Connection interrupted...";
    }
    if (peer.connectionState === "connected") {
      statusEl.textContent = "Grandpa's screen is connected ❤️";
    }
  };
}

async function handleOffer(offer) {
  await peer.setRemoteDescription(offer);
  for (const c of pendingCandidates) await peer.addIceCandidate(c);
  pendingCandidates = [];
  const answer = await peer.createAnswer();
  await peer.setLocalDescription(answer);
  send("answer", peer.localDescription);
  statusEl.textContent = "Connecting to Grandpa's screen...";
}

async function handleMessage(event) {
  const message = JSON.parse(event.data);

  if (message.type === "config") {
    createPeer(message.data.iceServers);
    return;
  }
  if (message.type === "waiting") {
    statusEl.textContent = "Waiting for Grandpa to accept...";
    return;
  }
  if (message.type === "paired") {
    statusEl.textContent = "Grandpa accepted. Waiting for his screen...";
    return;
  }
  if (message.type === "offer" && peer) {
    await handleOffer(message.data);
    return;
  }
  if (message.type === "candidate" && message.data && peer) {
    const candidate = new RTCIceCandidate(message.data);
    if (peer.remoteDescription) {
      await peer.addIceCandidate(candidate);
    } else {
      pendingCandidates.push(candidate);
    }
    return;
  }
  if (message.type === "ended") {
    finish("Grandpa has ended the session.");
    return;
  }
  if (message.type === "expired") {
    finish("This invitation has expired.");
  }
}

if (!token) {
  statusEl.textContent = "Invalid or missing invitation.";
} else {
  history.replaceState(null, "", location.pathname);

  const protocol = location.protocol === "https:" ? "wss:" : "ws:";
  socket = new WebSocket(
    `${protocol}//${location.host}/ws?token=${encodeURIComponent(token)}`
  );

  socket.onmessage = event => {
    handleMessage(event).catch(err => {
      console.error(err);
      statusEl.textContent = "Connection error. Please create a new invitation.";
    });
  };

  socket.onerror = () => {
    if (!finished) statusEl.textContent = "Unable to connect to the server.";
  };

  socket.onclose = event => {
    if (finished) return;
    statusEl.textContent = event.reason
      ? "Connection closed: " + event.reason
      : "Connection closed.";
  };
}

stopBtn.addEventListener("click", () => finish("You ended the session."));
</script>
</body>
</html>
