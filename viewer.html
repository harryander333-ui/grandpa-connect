<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grandpa Connect — Viewer</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#101e31;color:#f8fafc;font:16px system-ui,Arial,sans-serif}header{text-align:center;padding:18px 12px 5px}header h1{font-size:21px;margin:0}main{max-width:1350px;margin:auto;padding:12px;text-align:center}#status{color:#c1d4e7;min-height:2.5em;margin:10px 0}video{width:100%;max-height:77dvh;object-fit:contain;background:#000;border-radius:14px}nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:1px solid #52627b;background:#253750;color:#fff;border-radius:12px;padding:14px 20px;font-size:16px;min-height:49px;cursor:pointer}#stop{color:#ffbfc6;border-color:#74444b}small{display:block;color:#9cacc3;margin-top:12px}@media(max-width:600px){main{padding:4px}header{padding:10px}video{max-height:80dvh;border-radius:5px}button{flex:1}}
</style></head><body><header><h1>❤️ Grandpa Connect</h1></header><main>
<p id="status" role="status" aria-live="polite">Connecting securely…</p>
<video id="screen" autoplay playsinline muted></video>
<nav><button id="fullscreen">⛶ Fullscreen</button><button id="stop">End session</button></nav>
<small>Screen viewing only. Grandpa can stop sharing at any time.</small>
</main><script>
const statusEl=document.getElementById('status'),video=document.getElementById('screen');
const token=new URLSearchParams(location.search).get('token');
let socket=null,peer=null,iceServers=[],finished=false,retryTimer=null,retryCount=0,brokenTimer=null,pending=[],negotiation=0,lastRestart=0;
function setStatus(t){statusEl.textContent=t;}
function send(type,data){if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type,data}));}
function dropPeer(){negotiation++;clearTimeout(brokenTimer);brokenTimer=null;pending=[];const old=peer;peer=null;if(old)old.close();video.srcObject=null;}
function end(message,notify=true){if(finished)return;finished=true;clearTimeout(retryTimer);dropPeer();if(notify)send('end');if(socket){socket.close();socket=null;}setStatus(message);}
function requestRestart(){if(finished)return;setStatus('Connection interrupted. Reconnecting…');if(Date.now()-lastRestart<6000)return;lastRestart=Date.now();if(socket?.readyState===WebSocket.OPEN)send('restart');else scheduleReconnect();}
function createPeer(){
 dropPeer();const current=new RTCPeerConnection({iceServers});peer=current;
 current.ontrack=e=>{if(peer!==current)return;video.srcObject=e.streams[0]||new MediaStream([e.track]);video.play().catch(()=>{});setStatus('✅ Connected to Grandpa’s screen');};
 current.onicecandidate=e=>{if(peer===current&&e.candidate)send('candidate',e.candidate);};
 current.onconnectionstatechange=()=>{
   if(peer!==current||finished)return;
   if(current.connectionState==='connected'){clearTimeout(brokenTimer);brokenTimer=null;setStatus('✅ Connected to Grandpa’s screen');}
   if(current.connectionState==='disconnected'){setStatus('Connection interrupted. Recovering…');clearTimeout(brokenTimer);brokenTimer=setTimeout(()=>{if(peer===current&&current.connectionState==='disconnected')requestRestart();},5000);}
   if(current.connectionState==='failed')requestRestart();
 };
}
async function processMessage(e){
 const m=JSON.parse(e.data);if(finished)return;
 if(m.type==='config'){iceServers=m.data?.iceServers||[];return;}
 if(m.type==='waiting'){dropPeer();setStatus('Waiting for Grandpa to start sharing…');return;}
 if(m.type==='peer-left'){dropPeer();setStatus('Grandpa disconnected. Waiting for reconnection…');return;}
 if(m.type==='paired'){createPeer();setStatus('Connecting to Grandpa’s screen…');return;}
 if(m.type==='offer'){
   if(!peer)createPeer();const current=peer,version=negotiation;
   await current.setRemoteDescription(m.data);if(version!==negotiation)return;
   for(const c of pending){try{await current.addIceCandidate(c);}catch(e){console.warn('ICE candidate skipped',e);}}
   pending=[];
   const answer=await current.createAnswer();if(version!==negotiation)return;
   await current.setLocalDescription(answer);if(version!==negotiation)return;
   send('answer',current.localDescription);return;
 }
 if(m.type==='candidate'&&m.data){
   const candidate=new RTCIceCandidate(m.data);
   if(peer?.remoteDescription){try{await peer.addIceCandidate(candidate);}catch(e){console.warn('ICE candidate skipped',e);}}
   else pending.push(candidate);
   return;
 }
 if(m.type==='ended'||m.type==='expired')end('Session ended. Ask for a new invitation.',false);
}
function scheduleReconnect(){
 if(finished||retryTimer)return;
 setStatus('Internet interrupted. Trying to reconnect…');
 const delay=Math.min(1000*2**Math.min(retryCount++,4),15000);
 retryTimer=setTimeout(()=>{retryTimer=null;connectSocket();},delay);
}
function connectSocket(){
 if(finished)return;
 const ws=new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws?token=${encodeURIComponent(token)}`);socket=ws;
 ws.onopen=()=>{if(socket!==ws)return;retryCount=0;};
 ws.onmessage=e=>{if(socket!==ws)return;processMessage(e).catch(err=>{console.error(err);requestRestart();});};
 ws.onerror=()=>{};
 ws.onclose=e=>{
   if(socket!==ws||finished)return;
   socket=null;dropPeer();
   if(e.code===1008){end('This link has expired or is already open. Create a new invitation.',false);return;}
   scheduleReconnect();
 };
}
document.getElementById('stop').addEventListener('click',()=>end('You ended the session.'));
document.getElementById('fullscreen').addEventListener('click',async()=>{
 try{if(document.fullscreenElement)await document.exitFullscreen();else if(video.requestFullscreen)await video.requestFullscreen();else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen();}
 catch(e){setStatus('Fullscreen is unavailable in this browser.');}
});
window.addEventListener('online',()=>{if(!socket&&!finished){clearTimeout(retryTimer);retryTimer=null;connectSocket();}});
if(!token)setStatus('Missing viewer invitation.');
else{history.replaceState(null,'',location.pathname);connectSocket();}
</script></body></html>
