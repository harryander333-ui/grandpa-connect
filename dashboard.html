<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grandpa Connect Dashboard</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #15191f;
  color: white;
  font-family: Arial, sans-serif;
}
main { width: min(90%, 480px); text-align: center; padding: 20px 0; }
button {
  width: 100%;
  padding: 22px;
  background: #159447;
  color: white;
  border: 0;
  border-radius: 14px;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: .6; }
input {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  margin: 8px 0 18px;
  border-radius: 8px;
  border: 1px solid #777;
}
a { color: #83d8a2; overflow-wrap: anywhere; }
.result { margin-top: 24px; }
.error { color: #ff8a8a; }
</style>
</head>
<body>
<main>
  <h1>Grandpa Connect ❤️</h1>
  <p>Your private support dashboard</p>

  <label for="secret">Private owner secret</label>
  <input id="secret" type="password" autocomplete="off"
         placeholder="Enter your private secret">

  <button id="create">CREATE INVITATION</button>
  <div class="result" id="result" aria-live="polite"></div>
</main>

<script>
const secret = document.getElementById("secret");
const create = document.getElementById("create");
const result = document.getElementById("result");

function showError(message) {
  result.innerHTML = "";
  const p = document.createElement("p");
  p.className = "error";
  p.textContent = message;
  result.append(p);
}

async function createInvitation() {
  if (!secret.value) {
    showError("Enter your owner secret.");
    return;
  }

  create.disabled = true;
  result.textContent = "Creating invitation...";

  try {
    const response = await fetch("/api/invitations", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-owner-secret": secret.value
      },
      body: "{}"
    });

    let data = null;
    try {
      data = await response.json();
    } catch {
      /* server returned something that is not JSON */
    }

    if (!response.ok || !data) {
      throw new Error(
        (data && data.error) ||
        "Server error (" + response.status + "). Is the server running " +
        "and is this page opened from the server's own address?"
      );
    }

    result.innerHTML = "";

    for (const [label, url] of [
      ["Grandpa's invitation", data.grandpaUrl],
      ["Your private viewer", data.viewerUrl]
    ]) {
      const heading = document.createElement("h3");
      heading.textContent = label;

      const link = document.createElement("a");
      link.textContent = url;
      if (/^https?:\/\//.test(url)) link.href = url;

      const copy = document.createElement("button");
      copy.textContent = "COPY " + label.toUpperCase();
      copy.style.marginTop = "12px";
      copy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(url);
          copy.textContent = "COPIED!";
        } catch {
          // Fallback: select the link text so it can be copied manually
          const range = document.createRange();
          range.selectNodeContents(link);
          const sel = getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          copy.textContent = "PRESS CTRL+C TO COPY";
        }
      });

      result.append(heading, link, copy);
    }

    const expiry = document.createElement("p");
    expiry.textContent =
      "The invitation must be accepted within 30 minutes. Each link works once.";
    result.append(expiry);
  } catch (error) {
    showError(error.message);
  } finally {
    create.disabled = false;
  }
}

create.addEventListener("click", createInvitation);
secret.addEventListener("keydown", e => {
  if (e.key === "Enter") createInvitation();
});
</script>
</body>
</html>
