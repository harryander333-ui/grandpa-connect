<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Support — Dashboard</title><style>
:root{color-scheme:light;--blue:#155bd4;--ink:#172b46;--muted:#66788e;--border:#dce5f0}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#f3f6fa;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{background:white;border-bottom:1px solid var(--border);padding:18px clamp(18px,5vw,68px);display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:800;display:flex;gap:12px;align-items:center}.logo{background:#eaf1ff;color:#175cd3;border-radius:12px;width:40px;height:40px;display:grid;place-items:center}header small{color:var(--muted)}.shell{max-width:750px;margin:50px auto;padding:0 16px}h1{font-size:clamp(30px,5vw,41px);letter-spacing:-1.2px;margin:0 0 8px}.subtitle{margin:0 0 25px;color:var(--muted);font-size:18px}.panel{background:white;border:1px solid var(--border);border-radius:22px;padding:clamp(22px,5vw,35px);box-shadow:0 15px 38px rgba(20,45,70,.05)}label{font-size:14px;font-weight:700;display:block;margin:0 0 9px}input{width:100%;border:1px solid #cdd8e7;border-radius:12px;padding:16px;font:inherit;color:var(--ink);background:#fff;margin:0 0 17px}input:focus-visible{outline:3px solid #b5cdfa}button{border:0;border-radius:12px;font:750 16px system-ui;cursor:pointer;padding:16px 20px;min-height:52px}.primary{width:100%;background:var(--blue);color:white}.primary:hover{background:#1049ab}.primary:disabled{opacity:.55}.secondary{background:#eaf1ff;color:#124cae;border:1px solid #bfd3f4}.secondary:hover{background:#dce9ff}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.actions button{flex:1 1 135px}.link-card{margin-top:15px;padding:20px;border:1px solid var(--border);border-radius:16px;background:#f9fbfe}.link-card h3{font-size:16px;margin:0 0 5px}.link-card p{color:var(--muted);font-size:14px;margin:0 0 11px}.link-card a{display:block;color:#155bd4;font-size:13px;overflow-wrap:anywhere}.link-card button{width:100%;margin-top:15px}.hint{color:#78869a;font-size:13px;margin:15px 0 0}.error{color:#a51e30}.success{color:#166534}#result:empty{display:none}footer{text-align:center;color:#7a8aa0;font-size:13px;margin:24px 0}@media(max-width:500px){header small{display:none}.shell{margin:25px auto}.panel{border-radius:18px}}
</style></head><body><header><div class="brand"><span class="logo">✦</span>Support</div><small>Private support sessions</small></header><main class="shell"><h1>Start a support session</h1><p class="subtitle">Create a private link and help someone with their screen.</p><div class="panel"><label for="secret">Your owner password</label><input id="secret" type="password" autocomplete="off" placeholder="Enter password"><button type="button" id="create" class="primary">Create support session</button><p id="message" aria-live="polite" role="status"></p><div id="result" aria-live="polite"></div></div><footer>Only share support links with people you trust.</footer></main><script>
const secret=document.getElementById('secret');
const create=document.getElementById('create');
const result=document.getElementById('result');
const message=document.getElementById('message');
function setMessage(text,isError=false){message.textContent=text;message.className=isError?'error':'success';}
async function copyText(value,button){
 try{await navigator.clipboard.writeText(value);button.textContent='Copied ✓';}
 catch{window.prompt('Copy this link:',value);}
}
function addLink(title,description,url,buttonText){
 const card=document.createElement('section');card.className='link-card';
 const h=document.createElement('h3');h.textContent=title;
 const p=document.createElement('p');p.textContent=description;
 const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=url;
 const copy=document.createElement('button');copy.className='secondary';copy.textContent=buttonText;copy.addEventListener('click',()=>copyText(url,copy));
 card.append(h,p,a,copy);result.append(card);
}
async function createInvitation(){
 if(!secret.value){setMessage('Enter your owner password first.',true);secret.focus();return;}
 create.disabled=true;create.textContent='Creating session…';setMessage('');result.replaceChildren();
 try{
  const response=await fetch('/api/invitations',{method:'POST',headers:{'Content-Type':'application/json','x-owner-secret':secret.value},body:'{}'});
  let data;try{data=await response.json();}catch{throw Error('The server did not return a valid response.');}
  if(!response.ok)throw Error(data.error||`Could not create session (${response.status}).`);
  if(!data.grandpaUrl||!data.viewerUrl)throw Error('The server did not return both invitation links.');
  addLink('1 · Share screen link','Send this link to the person who needs help.',data.grandpaUrl,'Copy sharing link');
  addLink('2 · Viewer link','Open this on your phone or computer to watch.',data.viewerUrl,'Copy viewer link');
  const note=document.createElement('p');note.className='hint';note.textContent='Links are private and time-limited. Use a fresh session for each new support call.';result.append(note);
  setMessage('Session created. Your links are ready.');
  secret.value='';
 }catch(e){setMessage(e.message||'Something went wrong.',true);}
 finally{create.disabled=false;create.textContent='Create support session';}
}
create.addEventListener('click',createInvitation);
secret.addEventListener('keydown',e=>{if(e.key==='Enter')createInvitation();});
</script></body></html>
