
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grandpa Connect</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #f5f7f5;
  font-family: Arial, sans-serif;
}
main { text-align: center; }
button {
  background: #159447;
  color: white;
  border: 0;
  border-radius: 18px;
  padding: 30px 75px;
  font-size: 30px;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: .6; }
#status { margin-top: 24px; }
</style>
</head>
<body>
<main>
  <button id="accept">ACCEPT</button>
  <p id="status" aria-live="polite"></p>
</main>

<script>
const button = document.getElementById("accept");
const status = document.getElementById("status");

const invite = new URLSearchParams(
  location.search
).get("invite");

button.addEventListener("click", async () => {
  if (!invite) {
    status.textContent = "Invalid invitation.";
    return;
  }

  button.disabled = true;

  try {
    const stream =
      await navigator.mediaDevices.getDisplayMedia({
        video: true,
        audio: false
      });

    status.textContent =
      "Screen sharing is active. You can stop sharing at any time.";

    stream.getTracks().forEach(track => {
      track.addEventListener("ended", () => {
        status.textContent = "Screen sharing stopped.";
        button.disabled = false;
      });
    });

    // Screen transmission will be added in the next stage.
    // This page does not send screen data to anyone yet.

  } catch (error) {
    status.textContent = "Screen sharing was not started.";
    button.disabled = false;
  }
});
</script>
</body>
</html>
