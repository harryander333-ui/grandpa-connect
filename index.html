
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Support | Share Your Screen</title>

<style>
:root {
  --blue:#155bd5;
  --text:#172b46;
  --muted:#617189;
  --border:#dfe6ef;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100dvh;
  background:#f3f6fb;
  color:var(--text);
  font:18px/1.5 system-ui,-apple-system,
       "Segoe UI",sans-serif;
}
header {
  background:white;
  border-bottom:1px solid var(--border);
  padding:17px 25px;
  font-size:22px;
  font-weight:800;
  letter-spacing:-.5px;
}
header span {
  display:inline-grid;
  place-items:center;
  width:40px;
  height:40px;
  margin-right:10px;
  background:#e9f0ff;
  border-radius:12px;
  color:var(--blue);
}
.wrapper {
  min-height:calc(100dvh - 76px);
  display:grid;
  place-items:center;
  padding:20px;
}
main {
  width:100%;
  max-width:560px;
  background:white;
  padding:45px 35px;
  border:1px solid var(--border);
  border-radius:24px;
  text-align:center;
  box-shadow:0 15px 45px rgba(25,55,95,.06);
}
.symbol {
  width:82px;
  height:82px;
  margin:0 auto 23px;
  border-radius:23px;
  display:grid;
  place-items:center;
  background:#e9f0ff;
  color:var(--blue);
  font-size:40px;
}
h1 {
  font-size:clamp(30px,5vw,40px);
  line-height:1.2;
  margin:0 0 15px;
  letter-spacing:-1px;
}
p {
  color:var(--muted);
  margin:0 0 25px;
}
button {
  width:100%;
  padding:25px 15px;
  border:0;
  border-radius:16px;
  background:var(--blue);
  color:white;
  font:800 25px system-ui,sans-serif;
  cursor:pointer;
}
button:hover { background:#114cb2; }
button:disabled { opacity:.55; cursor:default; }
button:focus-visible {
  outline:4px solid #a2bfff;
  outline-offset:3px;
}
.stop {
  margin-top:15px;
  padding:18px;
  color:#aa2435;
  background:#fff;
  border:2px solid #ebbec4;
  font-size:20px;
}
.stop:hover { background:#fff5f6; }
.hidden { display:none!important; }
.status {
  margin-top:25px;
  padding:16px;
  background:#f5f8fd;
  border:1px solid var(--border);
  border-radius:13px;
  font-size:16px;
  font-weight:600;
  color:#345276;
}
.note {
  margin-top:22px;
  font-size:14px;
  color:#66778e;
}
#quality {
  font-size:12px;
  color:#8794a6;
  margin-top:12px;
}
@media(max-width:480px) {
  main { padding:30px 20px; }
  .wrapper { padding:13px; align-items:start; }
}
</style>
</head>

<body>
<header><span>✦</span> Support</header>

<div class="wrapper">
<main>
  <div class="symbol">▣</div>

  <h1>Let's get you some help.</h1>

  <p>
    Click the button below, choose your screen,
    then press <strong>Share</strong>.
  </p>

  <button id="share" type="button">
    Share my screen
  </button>

  <button id="stop"
          type="button"
          class="stop hidden">
    Stop sharing
  </button>

  <div id="status"
       class="status"
       role="status"
       aria-live="polite">
    Ready when you are.
  </div>

  <div class="note">
    You control what you share.
    You can stop at any time.
  </div>

  <div id="quality">
    Video quality: Automatic
  </div>
</main>
</div>

<script>
"use strict";

// SUPPORT SESSION
const token = new URLSearchParams(
  location.search
).get("invite");

const share = document.getElementById("share");
const stop = document.getElementById("stop");
const statusEl = document.getElementById("status");
const qualityEl = document.getElementById("quality");

let stream = null;
let socket = null;
let peer = null;
let sender = null;
let iceServers = [];
let finished = false;

let retryTimer = null;
let retryCount = 0;
let brokenTimer = null;
let negotiation = 0;
let pending = [];
let waitingForAnswer = false;
let lastRestart = 0;

// VIDEO QUALITY
// Balanced desktop-sharing settings.
// Prefer readable text and moderate frame rate.
const BITRATES = [
  900000,
  1500000,
  2400000,
  3500000,
  4500000
];

const FPS = 24;
let level = 2;
let qualityTimer = null;
let qualityBusy = false;
let healthySamples = 0;
let lastQualityChange = 0;

function setStatus(text) {
  statusEl.textContent = text;
}

function send(type, data) {
  if (
    socket &&
    socket.readyState === WebSocket.OPEN
  ) {
    socket.send(JSON.stringify({
      type,
      data
    }));
  }
}

function stopQualityMonitor() {
  clearInterval(qualityTimer);
  qualityTimer = null;
}

function dropPeer() {
  stopQualityMonitor();
  negotiation++;

  clearTimeout(brokenTimer);
  brokenTimer = null;

  pending = [];
  waitingForAnswer = false;

  const previous = peer;
  peer = null;
  sender = null;

  if (previous) {
    previous.close();
  }
}

function end(message, notify = true) {
  if (finished) return;

  finished = true;
  clearTimeout(retryTimer);

  if (notify) send("end");

  dropPeer();

  if (socket) {
    socket.close();
    socket = null;
  }

  if (stream) {
    stream.getTracks().forEach(
      track => track.stop()
    );
    stream = null;
  }

  share.disabled = true;
  stop.classList.add("hidden");

  setStatus(message);
}

// VIDEO ENCODING
async function applyQuality(targetSender = sender) {
  if (!targetSender) return;

  const params = targetSender.getParameters();

  if (!params.encodings?.length) {
    params.encodings = [{}];
  }

  params.encodings[0].maxBitrate = BITRATES[level];
  params.encodings[0].maxFramerate = FPS;

  // Preserve desktop details rather than
  // automatically reducing resolution.
  params.degradationPreference =
    "maintain-resolution";

  try {
    await targetSender.setParameters(params);

    if (sender === targetSender) {
      const names = [
        "Data saver",
        "Standard",
        "Balanced",
        "High",
        "Maximum"
      ];

      qualityEl.textContent =
        "Video quality: Auto · " +
        names[level];
    }
  } catch (error) {
    console.warn(
      "Encoder settings unavailable:",
      error
    );

    qualityEl.textContent =
      "Video quality: Browser automatic";
  }
}

// Measure network feedback conservatively.
// Avoid rapid bitrate fluctuations.
function startQualityMonitor(current) {
  stopQualityMonitor();

  qualityTimer = setInterval(async () => {
    if (
      qualityBusy ||
      peer !== current ||
      current.connectionState !== "connected" ||
      !sender
    ) return;

    qualityBusy = true;
    const activeSender = sender;

    try {
      const report = await activeSender.getStats();

      if (peer !== current) return;

      let loss = null;
      let rtt = null;

      report.forEach(stat => {
        if (
          stat.type === "remote-inbound-rtp" &&
          (stat.kind === "video" ||
           stat.mediaType === "video")
        ) {
          if (Number.isFinite(stat.fractionLost)) {
            loss = stat.fractionLost;
          }

          if (Number.isFinite(stat.roundTripTime)) {
            rtt = stat.roundTripTime;
          }
        }
      });

      if (loss === null && rtt === null) {
        return;
      }

      const congested =
        (loss !== null && loss > 0.08) ||
        (rtt !== null && rtt > 0.65);

      const healthy =
        (loss === null || loss < 0.015) &&
        (rtt === null || rtt < 0.22);

      const now = Date.now();

      if (congested) {
        healthySamples = 0;

        if (
          level > 0 &&
          now - lastQualityChange > 12000
        ) {
          level--;
          lastQualityChange = now;
          await applyQuality(activeSender);
        }
      } else if (healthy) {
        healthySamples++;

        if (
          healthySamples >= 4 &&
          level < BITRATES.length - 1 &&
          now - lastQualityChange > 20000
        ) {
          level++;
          healthySamples = 0;
          lastQualityChange = now;

          await applyQuality(activeSender);
        }
      } else {
        healthySamples = 0;
      }

    } catch (error) {
      console.warn(
        "Quality statistics:",
        error
      );
    } finally {
      qualityBusy = false;
    }
  }, 5000);
}

// WEBRTC CONNECTION
function createPeer() {
  dropPeer();

  const current = new RTCPeerConnection({
    iceServers,
    bundlePolicy: "max-bundle"
  });

  peer = current;

  for (const track of stream.getTracks()) {
    if (track.kind === "video") {
      try {
        track.contentHint = "detail";
      } catch (error) {}

      sender = current.addTrack(track, stream);

      level = 2;
      healthySamples = 0;
      lastQualityChange = Date.now();

      applyQuality(sender);
    } else {
      current.addTrack(track, stream);
    }
  }

  current.onicecandidate = event => {
    if (
      event.candidate &&
      peer === current
    ) {
      send("candidate", event.candidate);
    }
  };

  current.onconnectionstatechange = () => {
    if (
      peer !== current ||
      finished
    ) return;

    const state = current.connectionState;

    if (state === "connected") {
      clearTimeout(brokenTimer);
      brokenTimer = null;

      setStatus(
        "✅ Your screen is being shared."
      );

      startQualityMonitor(current);
    }

    if (state === "disconnected") {
      stopQualityMonitor();

      setStatus(
        "Connection interrupted. Reconnecting…"
      );

      clearTimeout(brokenTimer);

      brokenTimer = setTimeout(() => {
        if (
          peer === current &&
          current.connectionState ===
          "disconnected"
        ) {
          requestRestart();
        }
      }, 5000);
    }

    if (state === "failed") {
      stopQualityMonitor();
      requestRestart();
    }
  };
}

function requestRestart() {
  if (
    finished ||
    !stream
  ) return;

  setStatus(
    "Reconnecting automatically…"
  );

  if (
    Date.now() - lastRestart < 6000
  ) return;

  lastRestart = Date.now();

  if (
    socket?.readyState === WebSocket.OPEN
  ) {
    send("restart");
  } else {
    scheduleReconnect();
  }
}

async function makeOffer() {
  if (
    !stream ||
    finished ||
    waitingForAnswer
  ) return;

  createPeer();

  const current = peer;
  const version = negotiation;

  waitingForAnswer = true;

  try {
    const offer = await current.createOffer();

    if (
      version !== negotiation
    ) return;

    await current.setLocalDescription(offer);

    if (
      version !== negotiation
    ) return;

    send(
      "offer",
      current.localDescription
    );

    setStatus("Connecting…");

  } catch (error) {
    console.error(error);
    waitingForAnswer = false;
    requestRestart();
  }
}

// SIGNALING
async function processMessage(event) {
  const message = JSON.parse(event.data);

  if (finished) return;

  if (message.type === "config") {
    iceServers =
      message.data?.iceServers || [];

    return;
  }

  if (message.type === "waiting") {
    dropPeer();

    setStatus(
      "Waiting for your support person…"
    );
    return;
  }

  if (message.type === "peer-left") {
    dropPeer();

    setStatus(
      "The viewer disconnected. Waiting for reconnection…"
    );
    return;
  }

  if (message.type === "paired") {
    await makeOffer();
    return;
  }

  if (
    message.type === "answer" &&
    peer
  ) {
    const current = peer;

    if (
      current.signalingState !==
      "have-local-offer"
    ) return;

    await current.setRemoteDescription(
      message.data
    );

    if (
      peer !== current
    ) return;

    for (const candidate of pending) {
      try {
        await current.addIceCandidate(
          candidate
        );
      } catch (error) {
        console.warn(error);
      }
    }

    pending = [];
    waitingForAnswer = false;

    return;
  }

  if (
    message.type === "candidate" &&
    message.data &&
    peer
  ) {
    const candidate = new RTCIceCandidate(
      message.data
    );

    if (peer.remoteDescription) {
      try {
        await peer.addIceCandidate(
          candidate
        );
      } catch (error) {
        console.warn(error);
      }
    } else {
      pending.push(candidate);
    }

    return;
  }

  if (
    message.type === "ended" ||
    message.type === "expired"
  ) {
    end(
      "Session ended. Please request a new invitation.",
      false
    );
  }
}

// AUTOMATIC RECONNECTION
function scheduleReconnect() {
  if (
    finished ||
    !stream ||
    retryTimer
  ) return;

  setStatus(
    "Internet interrupted. Reconnecting…"
  );

  const delay = Math.min(
    1000 * 2 ** Math.min(retryCount++, 4),
    15000
  );

  retryTimer = setTimeout(() => {
    retryTimer = null;
    connectSocket();
  }, delay);
}

function connectSocket() {
  if (
    finished ||
    !stream
  ) return;

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  const url =
    `${protocol}//${location.host}/ws?token=` +
    encodeURIComponent(token);

  const ws = new WebSocket(url);
  socket = ws;

  ws.onopen = () => {
    if (socket !== ws) return;
    retryCount = 0;
  };

  ws.onmessage = event => {
    if (socket !== ws) return;

    processMessage(event).catch(error => {
      console.error(error);
      requestRestart();
    });
  };

  ws.onerror = () => {};

  ws.onclose = event => {
    if (
      socket !== ws ||
      finished
    ) return;

    socket = null;
    dropPeer();

    if (event.code === 1008) {
      end(
        "Session expired. Please request a new invitation.",
        false
      );
      return;
    }

    scheduleReconnect();
  };
}

// SHARE SCREEN
if (!token) {
  share.disabled = true;
  setStatus(
    "Please open your personal invitation link."
  );
}
else if (
  !navigator.mediaDevices?.getDisplayMedia
) {
  share.disabled = true;

  setStatus(
    "Please open this link on a Windows or Mac computer using Chrome or Edge."
  );
}
else {
  // Hide private invitation token from
  // the address bar after loading it.
  history.replaceState(
    null,
    "",
    location.pathname
  );

  share.addEventListener(
    "click",
    async () => {
      share.disabled = true;

      setStatus(
        "Choose your screen in the browser popup…"
      );

      try {
        stream =
          await navigator.mediaDevices.getDisplayMedia({
            video: {
              displaySurface: "monitor",

              width: {
                ideal: 1920
              },

              height: {
                ideal: 1080
              },

              frameRate: {
                ideal: 24,
                max: 30
              }
            },

            audio: false,
            selfBrowserSurface: "exclude"
          });

      } catch (error) {
        share.disabled = false;

        setStatus(
          "Sharing wasn't started. Click the button to try again."
        );

        return;
      }

      const videoTrack =
        stream.getVideoTracks()[0];

      if (videoTrack) {
        videoTrack.addEventListener(
          "ended",
          () => end("You stopped sharing.")
        );
      }

      share.classList.add("hidden");
      stop.classList.remove("hidden");

      connectSocket();
    }
  );

  stop.addEventListener(
    "click",
    () => end("You stopped sharing.")
  );

  window.addEventListener(
    "online",
    () => {
      if (
        !socket &&
        !finished &&
        stream
      ) {
        clearTimeout(retryTimer);
        retryTimer = null;

        connectSocket();
      }
    }
  );
}
</script>
</body>
</html>
