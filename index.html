<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grandpa Connect</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #f5f7f5;
  font-family: Arial, sans-serif;
}
main { text-align: center; padding: 20px; max-width: 640px; }
button {
  background: #159447;
  color: white;
  border: 0;
  border-radius: 18px;
  padding: 30px 75px;
  font-size: 30px;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: .6; cursor: default; }
#status { margin-top: 24px; color: #333; font-size: 22px; line-height: 1.4; }
.howto {
  display: none;
  text-align: left;
  background: white;
  border: 2px solid #159447;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 28px;
  font-size: 22px;
  line-height: 1.5;
}
.howto.show { display: block; }
.howto ol { margin: 10px 0 0; padding-left: 28px; }
.howto li { margin-bottom: 10px; }
.howto b { color: #159447; }
.howto img {
  display: block;
  max-width: 100%;
  border-radius: 10px;
  margin-top: 14px;
  border: 1px solid #ccc;
}
</style>
</head>
<body>
<main>
  <div class="howto" id="howto">
    <p><b>Before you press the button:</b></p>
    <ol>
      <li>A box will pop up asking what to share.</li>
      <li>Click the picture of <b>your whole screen</b> (it may say "Entire Screen" or "Screen 1").</li>
      <li>Then click the blue <b>Share</b> button.</li>
    </ol>
  </div>
  <button id="accept">ACCEPT</button>
  <p id="status" aria-live="polite"></p>
</main>

<script>
const button = document.getElementById("accept");
const statusEl = document.getElementById("status");
const howto = document.getElementById("howto");
const token = new URLSearchParams(location.search).get("invite");

let socket = null;
let peer = null;
let stream = null;
let iceServers = null;
let paired = false;
let offerStarted = false;
let finished = false;
let pendingCandidates = [];

function send(type, data) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type, data }));
  }
}

function finish(message) {
  finished = true;
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  if (peer) {
    peer.close();
    peer = null;
  }
  if (socket) {
    const s = socket;
    socket = null;
    s.close();
  }
  statusEl.textContent = message;
  button.disabled = true; // invitation is single-use; ask for a new one
}

function createPeer() {
  peer = new RTCPeerConnection({ iceServers: iceServers || [] });

  stream.getTracks().forEach(track => peer.addTrack(track, stream));

  peer.onicecandidate = event => {
    if (event.candidate) send("candidate", event.candidate);
  };

  peer.onconnectionstatechange = () => {
    if (!peer) return;
    if (peer.connectionState === "connected") {
      statusEl.textContent = "Your screen is being shared.";
    }
    if (peer.connectionState === "failed") {
      finish("Connection failed. Please ask for a new invitation.");
    }
  };

  const track = stream.getVideoTracks()[0];
  if (track) {
    track.addEventListener("ended", () => {
      if (!finished) finish("Screen sharing stopped.");
    });
  }
}

async function startOffer() {
  if (!paired || !peer || offerStarted) return;
  offerStarted = true;
  statusEl.textContent = "Connecting...";
  const offer = await peer.createOffer();
  await peer.setLocalDescription(offer);
  send("offer", peer.localDescription);
}

async function handleMessage(event) {
  const message = JSON.parse(event.data);

  if (message.type === "config") {
    iceServers = message.data.iceServers;
    createPeer();
    return;
  }

  if (message.type === "waiting") {
    statusEl.textContent = "Waiting for your family member to connect...";
    return;
  }

  if (message.type === "paired") {
    paired = true;
    await startOffer();
    return;
  }

  if (message.type === "answer" && peer) {
    await peer.setRemoteDescription(message.data);
    for (const c of pendingCandidates) await peer.addIceCandidate(c);
    pendingCandidates = [];
    return;
  }

  if (message.type === "candidate" && message.data && peer) {
    const candidate = new RTCIceCandidate(message.data);
    if (peer.remoteDescription) {
      await peer.addIceCandidate(candidate);
    } else {
      pendingCandidates.push(candidate);
    }
    return;
  }

  if (message.type === "ended" || message.type === "expired") {
    finish("Session ended.");
  }
}

function openSocket() {
  const protocol = location.protocol === "https:" ? "wss:" : "ws:";
  socket = new WebSocket(
    `${protocol}//${location.host}/ws?token=${encodeURIComponent(token)}`
  );

  socket.onmessage = event => {
    handleMessage(event).catch(err => {
      console.error(err);
      finish("Connection error. Please ask for a new invitation.");
    });
  };

  socket.onerror = () => {
    if (!finished) statusEl.textContent = "Unable to connect to the server.";
  };

  socket.onclose = event => {
    if (finished) return;
    finish(event.reason
      ? "Connection closed: " + event.reason
      : "Connection closed.");
  };
}

if (!token) {
  button.disabled = true;
  statusEl.textContent = "Invalid or expired invitation.";
} else if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
  // Phones and tablets cannot share their screen from a web page.
  button.disabled = true;
  statusEl.textContent =
    "Screen sharing only works on a computer (Windows, Mac or Chromebook) " +
    "using Chrome, Edge, Firefox or Safari. It does not work on phones or tablets.";
} else {
  // Hide the secret token from the address bar
  history.replaceState(null, "", location.pathname);
  howto.classList.add("show");

  button.addEventListener("click", async () => {
    button.disabled = true;
    statusEl.textContent = "Please choose your whole screen in the box that pops up, then click Share.";

    try {
      stream = await navigator.mediaDevices.getDisplayMedia({
        video: {
          // Hints the browser to open on "Entire Screen" first.
          // Chrome/Edge respect this; other browsers ignore it safely.
          displaySurface: "monitor"
        },
        audio: false,
        // Don't offer "this tab" as a sharing option — it's never useful here.
        selfBrowserSurface: "exclude",
        // Keep sharing the chosen screen even if the user switches tabs/windows.
        surfaceSwitching: "exclude"
      });
    } catch (err) {
      stream = null;
      button.disabled = false;
      statusEl.textContent = "Screen sharing was not started. Press ACCEPT to try again.";
      return;
    }

    statusEl.textContent = "Connecting...";
    openSocket();
  });
}
</script>
</body>
</html>
