<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grandpa Connect — Share Screen</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#101e31;color:#fff;font:18px system-ui,Arial,sans-serif;display:grid;place-items:center;padding:22px}main{text-align:center;max-width:500px;width:100%}h1{font-size:clamp(28px,5vw,42px);margin:0 0 15px}p{line-height:1.55;color:#c6d5e6}button{border:0;border-radius:18px;background:#eab46c;color:#18120b;font-weight:800;font-size:clamp(22px,5vw,30px);padding:27px 18px;width:100%;cursor:pointer}button:disabled{opacity:.6;cursor:default}.stop{background:#342b36;color:#ffc4c4;border:1px solid #84525b;font-size:17px;padding:17px;margin-top:22px}.hidden{display:none}#status{min-height:3em;margin-top:22px}small{color:#b5c2d6;display:block;margin-top:15px}
</style></head><body><main>
<h1>❤️ Grandpa Connect</h1>
<p id="guide">Press the big button, choose your screen and click Share.</p>
<button id="share">Share my screen</button>
<button id="stop" class="stop hidden">Stop sharing</button>
<p id="status" role="status" aria-live="polite">Ready when you are.</p>
<small>Screen sharing stays visible. You can stop it at any time.</small>
</main><script>
const token=new URLSearchParams(location.search).get('invite');
const share=document.getElementById('share'),stop=document.getElementById('stop'),statusEl=document.getElementById('status');
let stream=null,socket=null,peer=null,iceServers=[],finished=false,retryTimer=null,retryCount=0,brokenTimer=null,negotiation=0,pending=[],waitingForAnswer=false,lastRestart=0;
const setStatus=t=>{statusEl.textContent=t;};
function send(type,data){if(socket?.readyState===WebSocket.OPEN) socket.send(JSON.stringify({type,data}));}
function dropPeer(){negotiation++;clearTimeout(brokenTimer);brokenTimer=null;pending=[];waitingForAnswer=false;const old=peer;peer=null;if(old) old.close();}
function end(message,notify=true){if(finished)return;finished=true;clearTimeout(retryTimer);dropPeer();if(notify)send('end');if(socket){socket.close();socket=null;}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}share.disabled=true;stop.classList.add('hidden');setStatus(message);}
function createPeer(){
 dropPeer();const current=new RTCPeerConnection({iceServers});peer=current;
 for(const track of stream.getTracks())current.addTrack(track,stream);
 current.onicecandidate=e=>{if(e.candidate&&peer===current)send('candidate',e.candidate);};
 current.onconnectionstatechange=()=>{
   if(peer!==current||finished)return;
   if(current.connectionState==='connected'){clearTimeout(brokenTimer);brokenTimer=null;setStatus('✅ Your screen is being shared.');}
   if(current.connectionState==='disconnected'){setStatus('Connection interrupted. Recovering…');clearTimeout(brokenTimer);brokenTimer=setTimeout(()=>{if(peer===current&&current.connectionState==='disconnected')requestRestart();},5000);}
   if(current.connectionState==='failed')requestRestart();
 };
}
function requestRestart(){if(finished||!stream)return;setStatus('Reconnecting automatically…');if(Date.now()-lastRestart<6000)return;lastRestart=Date.now();if(socket?.readyState===WebSocket.OPEN)send('restart');else scheduleReconnect();}
async function makeOffer(){
 if(!stream||finished||waitingForAnswer)return;
 createPeer();const current=peer,version=negotiation;waitingForAnswer=true;
 try{const offer=await current.createOffer();if(version!==negotiation)return;await current.setLocalDescription(offer);if(version!==negotiation)return;send('offer',current.localDescription);setStatus('Connecting…');}
 catch(e){console.error(e);requestRestart();}
}
async function processMessage(e){
 const m=JSON.parse(e.data);if(finished)return;
 if(m.type==='config'){iceServers=m.data?.iceServers||[];return;}
 if(m.type==='waiting'){dropPeer();setStatus('Waiting for your family member…');return;}
 if(m.type==='peer-left'){dropPeer();setStatus('Other device disconnected. Waiting for it to reconnect…');return;}
 if(m.type==='paired'){await makeOffer();return;}
 if(m.type==='answer'&&peer){
   const current=peer;if(current.signalingState!=='have-local-offer')return;
   await current.setRemoteDescription(m.data);if(peer!==current)return;
   for(const c of pending){try{await current.addIceCandidate(c);}catch(e){console.warn('ICE candidate skipped',e);}}
   pending=[];waitingForAnswer=false;return;
 }
 if(m.type==='candidate'&&m.data&&peer){
   const candidate=new RTCIceCandidate(m.data);
   if(peer.remoteDescription){try{await peer.addIceCandidate(candidate);}catch(e){console.warn('ICE candidate skipped',e);}}
   else pending.push(candidate);
   return;
 }
 if(m.type==='ended'||m.type==='expired')end('Session ended. Ask for a new invitation.',false);
}
function scheduleReconnect(){
 if(finished||!stream||retryTimer)return;
 setStatus('Internet interrupted. Trying to reconnect…');
 const delay=Math.min(1000*2**Math.min(retryCount++,4),15000);
 retryTimer=setTimeout(()=>{retryTimer=null;connectSocket();},delay);
}
function connectSocket(){
 if(finished||!stream)return;
 const url=`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws?token=${encodeURIComponent(token)}`;
 const ws=new WebSocket(url);socket=ws;
 ws.onopen=()=>{if(socket!==ws)return;retryCount=0;};
 ws.onmessage=e=>{if(socket!==ws)return;processMessage(e).catch(err=>{console.error(err);requestRestart();});};
 ws.onerror=()=>{};
 ws.onclose=e=>{
   if(socket!==ws||finished)return;
   socket=null;dropPeer();
   if(e.code===1008){end('This session has expired or is already open. Ask for a new invitation.',false);return;}
   scheduleReconnect();
 };
}
if(!token){share.disabled=true;setStatus('Please open the invitation link sent to you.');}
else if(!navigator.mediaDevices?.getDisplayMedia){share.disabled=true;setStatus('Open this link on a Windows or Mac computer in Chrome or Edge.');}
else{
 history.replaceState(null,'',location.pathname);
 share.addEventListener('click',async()=>{
   share.disabled=true;setStatus('Choose the screen to share in the browser popup…');
   try{stream=await navigator.mediaDevices.getDisplayMedia({video:{displaySurface:'monitor'},audio:false,selfBrowserSurface:'exclude'});}
   catch(e){share.disabled=false;setStatus('Screen sharing was not started. Press the button to try again.');return;}
   stream.getVideoTracks()[0]?.addEventListener('ended',()=>end('You stopped sharing.'));
   share.classList.add('hidden');stop.classList.remove('hidden');connectSocket();
 });
 stop.addEventListener('click',()=>end('You stopped sharing.'));
 window.addEventListener('online',()=>{if(!socket&&!finished&&stream){clearTimeout(retryTimer);retryTimer=null;connectSocket();}});
}
</script></body></html>
